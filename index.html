<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00d4ff" />
    <meta name="description" content="Enterprise Security Matrix - Real-time threat detection and neutralization" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>AEGIS Quantum Shield - Security Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Only register service worker in production, not in dev/preview
      if ('serviceWorker' in navigator) {
        // Always unregister stale workers first to prevent stale cache issues
        navigator.serviceWorker.getRegistrations().then(registrations => {
          const isDevMode = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.port !== '';
          if (isDevMode) {
            // Unregister all service workers in dev to prevent stale cache
            registrations.forEach(r => r.unregister());
            // Clear all caches in dev
            if (window.caches) {
              caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
            }
          } else {
            // Production: register normally
            window.addEventListener('load', () => {
              navigator.serviceWorker.register('/sw.js')
                .then(r => console.log('SW registered:', r.scope))
                .catch(e => console.log('SW registration failed:', e));
            });
          }
        });
      }
    </script>
  </body>
</html>
