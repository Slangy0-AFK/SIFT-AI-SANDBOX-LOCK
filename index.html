    <script type="module">
if (window.self === window.top) {
  let lastPath = "";
  function getPageNameFromPath(path) {
    const segments = path.split("/").filter(Boolean);
    return segments[0] || null;
  }
  function trackPageView() {
    const path = window.location.pathname;
    if (path === lastPath) return;
    lastPath = path;
    const pageName = getPageNameFromPath(path) || "home";
    const appId = "";
    if (!appId) return;
    fetch(`/api/app-logs/${appId}/log-user-in-app/${pageName}`, {
      method: "POST",
    }).catch(() => {});
  }
  const originalPushState = history.pushState.bind(history);
  history.pushState = function (...args) {
    originalPushState(...args);
    trackPageView();
  };
  const originalReplaceState = history.replaceState.bind(history);
  history.replaceState = function (...args) {
    originalReplaceState(...args);
    trackPageView();
  };
  window.addEventListener("popstate", trackPageView);
  trackPageView();
}
</script>

    <script>
      // Only register service worker in production, not in dev/preview
      if ('serviceWorker' in navigator) {
        // Always unregister stale workers first to prevent stale cache issues
        navigator.serviceWorker.getRegistrations().then(registrations => {
          const isDevMode = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.port !== '';
          if (isDevMode) {
            // Unregister all service workers in dev to prevent stale cache
            registrations.forEach(r => r.unregister());
            // Clear all caches in dev
            if (window.caches) {
              caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
            }
          } else {
            // Production: register normally
            window.addEventListener('load', () => {
              navigator.serviceWorker.register('/sw.js')
                .then(r => console.log('SW registered:', r.scope))
                .catch(e => console.log('SW registration failed:', e));
            });
          }
        });
      }
    </script>
